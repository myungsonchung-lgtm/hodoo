[project]
name = "toe-mcp"
version = "0.1.0"
description = "MCP server for reading and writing TouchDesigner .toe files via toeexpand/toecollapse"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hodoonamu" }]
keywords = ["mcp", "touchdesigner", "toe", "derivative"]
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
toe-mcp = "toe_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toe_mcp"]
